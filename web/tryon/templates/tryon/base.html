{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fashion Try-On{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'tryon/css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <a href="{% url 'tryon:measure' %}" class="brand">Fashion Try-On</a>
    <nav>
      <a href="{% url 'tryon:measure' %}">Measure</a>
      <a href="{% url 'tryon:verify' %}">Verify</a>
      <a href="{% url 'tryon:wardrobe' %}">Wardrobe</a>
    </nav>
  </header>

  <main class="container">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="message message--{{ message.tags|default:'info' }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
